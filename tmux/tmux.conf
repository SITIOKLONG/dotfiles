# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'
# set -g @plugin 'tmux-plugins/tmux-cpu'

set -s set-clipboard on
set -g mouse on
set -g allow-passthrough on

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#005CB8"
cyan_soft="#88C0D0"
yellow_warm="#EBCB8B"
red_soft="#BF616A"

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold]#S #[fg=${gray_light},nobold] | "
# set -g status-right "#[fg=${gray_medium}]CPU #{cpu}  #[fg=${gray_medium}]MEM #{mem}"
set -g status-right '%a %h-%d %H:%M '
set -g window-status-current-format "#{?window_zoomed_flag,#[fg=${yellow_warm}#,bg=${gray_dark}#,bold] #I:#W [Z] ,#[fg=${cyan_soft}#,bold] #I:#W}"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "#{?window_zoomed_flag,fg=${green_soft}#,bold,fg=${gray_medium}}"

# Show pane border status (with pane index + current command) only when 2+ panes
set -g pane-border-status off
set -g pane-border-format "#[fg=${gray_medium}] #P: #{pane_current_command} #{?pane_active,#[fg=${cyan_soft}](active),}"
set-hook -g after-split-window     'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
set-hook -g after-kill-pane        'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
set-hook -g after-new-window       'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
set-hook -g session-window-changed 'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
set-hook -g after-select-layout    'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
